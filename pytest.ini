[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
addopts = -ra --strict-markers
# El marcador de cada prueba se asigna según su carpeta (ver tests/conftest.py).
markers =
    unit: dominio y aplicación puros, sin base de datos ni red
    property: pruebas basadas en propiedades (hypothesis)
    architecture: reglas de dependencias entre capas (hexagonal)
    integration: adaptadores reales (ORM, almacenamiento, comandos) contra SQLite
    contract: el mismo contrato verificado sobre varios adaptadores de un puerto (y paridad Python/JS)
    functional: vistas HTTP con el cliente de Django (roles, formularios, JSON, CSV)
    security: CSRF, control de acceso, XSS, redirecciones, secretos y privacidad
    performance: presupuesto de consultas SQL y tiempos de los parsers
    smoke: chequeos de arranque (system checks, migraciones, URLs, plantillas, estáticos)
    e2e: navegador real (Playwright + Chromium) contra un servidor vivo
