{% comment %}params: id, name, type, value, placeholder, required, help, error, inputmode, autocomplete, min, step, extra_class{% endcomment %}
<input class="form-control{% if error %} is-invalid{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}" id="{{ id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default_if_none:'' }}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if required %} required{% endif %}{% if inputmode %} inputmode="{{ inputmode }}"{% endif %}{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if min != None and min != "" %} min="{{ min }}"{% endif %}{% if step %} step="{{ step }}"{% endif %}{% if error %} aria-invalid="true"{% endif %}{% if help or error %} aria-describedby="{% if help %}{{ id }}-help {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}>
